services:
  - type: web
    name: aplicacion-inventario
    env: python
    buildCommand: pip install -r requirements.txt && python backend/create_database.py
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT backend.run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8080
