{% extends 'base.html' %}

{% block title %}Eliminar Empleado{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('empleados.index') }}" class="btn btn-secondary">← Volver</a>
</div>

<div class="alert alert-danger" role="alert">
    <h4 class="alert-heading">¿Eliminar este empleado?</h4>
    <p>
        Estás a punto de eliminar el empleado <strong>{{ empleado['nombre'] }} {{ empleado['apellido_paterno'] or '' }}</strong>.
        Esta acción no se puede deshacer.
    </p>
</div>

<form method="post" class="mt-4">
    <button type="submit" class="btn btn-danger">Eliminar Empleado</button>
    <a href="{{ url_for('empleados.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
