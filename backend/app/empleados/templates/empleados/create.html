{% extends 'base.html' %}

{% block title %}Crear Empleado{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('empleados.index') }}" class="btn btn-secondary">← Volver</a>
</div>

<h1>Crear Nuevo Empleado</h1>

<form method="post" class="mt-4">
    <div class="row">
        <div class="col-md-4">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="apellido_paterno">Apellido Paterno</label>
                <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="apellido_materno">Apellido Materno</label>
                <input type="text" class="form-control" id="apellido_materno" name="apellido_materno">
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="identificacion">Identificación (CURP, DNI, etc.)</label>
        <input type="text" class="form-control" id="identificacion" name="identificacion">
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="puesto">Puesto</label>
                <input type="text" class="form-control" id="puesto" name="puesto">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="departamento">Departamento</label>
                <input type="text" class="form-control" id="departamento" name="departamento">
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono">
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="salario">Salario</label>
        <input type="number" step="0.01" class="form-control" id="salario" name="salario" value="0">
    </div>
    
    <button type="submit" class="btn btn-success">Crear</button>
    <a href="{{ url_for('empleados.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
