{% extends 'base.html' %}

{% block title %}Crear Cliente{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary">← Volver</a>
</div>

<h1>Crear Nuevo Cliente</h1>

<form method="post" class="mt-4">
    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required>
    </div>
    
    <div class="form-group">
        <label for="tipo">Tipo</label>
        <select class="form-control" id="tipo" name="tipo">
            <option value="persona_fisica">Persona Física</option>
            <option value="persona_moral">Persona Moral</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="rfc">RFC</label>
        <input type="text" class="form-control" id="rfc" name="rfc">
    </div>
    
    <div class="form-group">
        <label for="direccion">Dirección</label>
        <textarea class="form-control" id="direccion" name="direccion" rows="2"></textarea>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="credito_limite">Crédito Límite</label>
        <input type="number" step="0.01" class="form-control" id="credito_limite" name="credito_limite" value="0">
    </div>
    
    <button type="submit" class="btn btn-success">Crear</button>
    <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
