{% extends 'base.html' %}

{% block title %}Editar Producto{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('productos.index') }}" class="btn btn-secondary">← Volver</a>
</div>

<h1>Editar Producto</h1>

<form method="post" class="mt-4">
    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ producto['nombre'] }}" required>
    </div>
    
    <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ producto['descripcion'] or '' }}</textarea>
    </div>
    
    <div class="form-group">
        <label for="categoria">Categoría</label>
        <input type="text" class="form-control" id="categoria" name="categoria" value="{{ producto['categoria'] or '' }}">
    </div>
    
    <div class="form-group">
        <label for="unidad_medida">Unidad de Medida</label>
        <input type="text" class="form-control" id="unidad_medida" name="unidad_medida" value="{{ producto['unidad_medida'] or '' }}">
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="precio_costo">Precio Costo</label>
                <input type="number" step="0.01" class="form-control" id="precio_costo" name="precio_costo" value="{{ producto['precio_costo'] or 0 }}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="precio_venta">Precio Venta</label>
                <input type="number" step="0.01" class="form-control" id="precio_venta" name="precio_venta" value="{{ producto['precio_venta'] or 0 }}">
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="stock_minimo">Stock Mínimo</label>
        <input type="number" step="0.01" class="form-control" id="stock_minimo" name="stock_minimo" value="{{ producto['stock_minimo'] or 0 }}">
    </div>
    
    <button type="submit" class="btn btn-warning">Actualizar</button>
    <a href="{{ url_for('productos.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
