{% extends 'base.html' %}

{% block title %}Eliminar Cliente{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary">← Volver</a>
</div>

<div class="alert alert-danger" role="alert">
    <h4 class="alert-heading">¿Eliminar este cliente?</h4>
    <p>
        Estás a punto de eliminar el cliente <strong>{{ cliente['nombre'] }}</strong>.
        Esta acción no se puede deshacer.
    </p>
</div>

<form method="post" class="mt-4">
    <button type="submit" class="btn btn-danger">Eliminar Cliente</button>
    <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
