{% extends 'base.html' %}

{% block title %}Editar Cliente{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary">← Volver</a>
</div>

<h1>Editar Cliente</h1>

<form method="post" class="mt-4">
    <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ cliente['nombre'] }}" required>
    </div>
    
    <div class="form-group">
        <label for="tipo">Tipo</label>
        <select class="form-control" id="tipo" name="tipo">
            <option value="persona_fisica" {% if cliente['tipo'] == 'persona_fisica' %}selected{% endif %}>Persona Física</option>
            <option value="persona_moral" {% if cliente['tipo'] == 'persona_moral' %}selected{% endif %}>Persona Moral</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="rfc">RFC</label>
        <input type="text" class="form-control" id="rfc" name="rfc" value="{{ cliente['rfc'] or '' }}">
    </div>
    
    <div class="form-group">
        <label for="direccion">Dirección</label>
        <textarea class="form-control" id="direccion" name="direccion" rows="2">{{ cliente['direccion'] or '' }}</textarea>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono" value="{{ cliente['telefono'] or '' }}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ cliente['email'] or '' }}">
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="credito_limite">Crédito Límite</label>
        <input type="number" step="0.01" class="form-control" id="credito_limite" name="credito_limite" value="{{ cliente['credito_limite'] or 0 }}">
    </div>
    
    <button type="submit" class="btn btn-warning">Actualizar</button>
    <a href="{{ url_for('clientes.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
